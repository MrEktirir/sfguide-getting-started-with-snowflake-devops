name: Deploy data pipeline

# Action will run on pushes to selected branches
on:
  push:
    branches:
      - dev
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    env:
      REPO_NAME: "quickstart_common.public.quickstart_repo"
      SNOWFLAKE_HOME: "${{ github.workspace }}/.snowflake"
      SNOWFLAKE_DEFAULT_CONNECTION_NAME: "default"
      SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: "SNOWFLAKE_JWT"
      SNOWFLAKE_CONNECTIONS_DEFAULT_WAREHOUSE: "QUICKSTART_WH"
      SNOWFLAKE_CONNECTIONS_DEFAULT_ROLE: "ACCOUNTADMIN"
      SNOWFLAKE_CONNECTIONS_DEFAULT_PRIVATE_KEY_FILE: ".snowflake/snowflake_rsa_key"
      # Read connection secrets
      SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SNOWFLAKE_USER }}

    steps:
      # Checkout step is necessary if you want to use a config file from your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Write private key secret as file
      - name: Configure Private Key
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p .snowflake
          printf '%s\n' "$PRIVATE_KEY" > .snowflake/snowflake_rsa_key
          chmod 600 .snowflake/snowflake_rsa_key

      # Install Snowflake CLI GitHub Action and point to config file
      - name: Install snowflake-cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install snowflake-cli==3.30.0
          snow --version

      # Update Snowflake's copy of the repository
      - name: Secure Snowflake configuration
        run: chmod 600 .snowflake/config.toml

      - name: Fetch repository changes
        run: snow git fetch "${REPO_NAME}"

      # Deploy pipeline with branch specific parameters
      - name: Deploy data pipeline to ${{ github.ref_name }}
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          if [ "${BRANCH_NAME}" == "main" ]; then
            RETENTION_TIME=1
          else
            RETENTION_TIME=0
          fi
          snow git execute \
            "@${REPO_NAME}/branches/${BRANCH_NAME}/steps/01_deploy_environment.sql" \
            -D "environment='${BRANCH_NAME}'"

          snow git execute \
            "@${REPO_NAME}/branches/${BRANCH_NAME}/steps/03_harmonize_data.py" \
            -D "environment='${BRANCH_NAME}'"

          snow git execute \
            "@${REPO_NAME}/branches/${BRANCH_NAME}/steps/04_orchestrate_jobs.sql" \
            -D "environment='${BRANCH_NAME}'" \
            -D "retention_time=${RETENTION_TIME}"
